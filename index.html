<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%279%27 r=%276%27 fill=%27%23f0c8a0%27 stroke=%27%230f380f%27/%3E%3Ccircle cx=%276%27 cy=%278%27 r=%271%27 fill=%27%230f380f%27/%3E%3Ccircle cx=%2710%27 cy=%278%27 r=%271%27 fill=%27%230f380f%27/%3E%3Cpath d=%27M5 11q3 3 6 0%27 stroke=%27%23d84030%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">
  <title>TarekMon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="gb">
    <div class="screen-frame">
      <canvas id="screen"></canvas>
    </div>
    <div class="controls">
      <div class="dpad">
        <button type="button" class="dpad-btn dpad-up" data-btn="up" aria-label="Up"></button>
        <button type="button" class="dpad-btn dpad-left" data-btn="left" aria-label="Left"></button>
        <button type="button" class="dpad-btn dpad-right" data-btn="right" aria-label="Right"></button>
        <button type="button" class="dpad-btn dpad-down" data-btn="down" aria-label="Down"></button>
        <div class="dpad-center"></div>
      </div>
      <div class="ab">
        <button type="button" class="ab-btn" data-btn="b" aria-label="B">B</button>
        <button type="button" class="ab-btn" data-btn="a" aria-label="A">A</button>
      </div>
    </div>
    <div class="bottom-row">
      <button type="button" class="start" data-btn="start"><span class="start-pill">Start</span></button>
      <button type="button" id="mute" aria-label="Mute">&#128266;</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
