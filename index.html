<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TarekMon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="gb">
    <div class="screen-frame">
      <canvas id="screen"></canvas>
    </div>
    <div class="controls">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-btn="up" aria-label="Up"></button>
        <button class="dpad-btn dpad-left" data-btn="left" aria-label="Left"></button>
        <button class="dpad-btn dpad-right" data-btn="right" aria-label="Right"></button>
        <button class="dpad-btn dpad-down" data-btn="down" aria-label="Down"></button>
        <div class="dpad-center"></div>
      </div>
      <div class="ab">
        <button class="ab-btn" data-btn="b" aria-label="B">B</button>
        <button class="ab-btn" data-btn="a" aria-label="A">A</button>
      </div>
    </div>
    <div class="bottom-row">
      <button class="start" data-btn="start"><span class="start-pill">Start</span></button>
      <button id="mute" aria-label="Mute">&#128266;</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
