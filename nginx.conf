server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }
  # Code and data must never be cached by Cloudflare/browsers across deploys; the stickers may.
  location ~* .(js|css|json)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }


    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
